services:
  docktail:
    image: ghcr.io/marvinvr/docktail:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale
    environment:
      - TAILSCALE_OAUTH_CLIENT_ID=${TAILSCALE_OAUTH_CLIENT_ID}
      - TAILSCALE_OAUTH_CLIENT_SECRET=${TAILSCALE_OAUTH_CLIENT_SECRET}
      - DEFAULT_SERVICE_TAGS=tag:docktail-service

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=stirling-pdf"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"
    environment:
      SECURITY_ENABLELOGIN: "true"
      STORAGE_ENABLED: "true"
      STORAGE_PROVIDER: "local"
      STORAGE_LOCAL_BASEPATH: "/storage"
    volumes:
      - ./stirling-data:/configs
      - ./stirling-data:/storage
    restart: unless-stopped

  transmute:
    image: ghcr.io/transmute-app/transmute:latest
    container_name: transmute
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=transmute"
      - "docktail.service.port=3313"
      - "docktail.service.service-port=443"
    restart: unless-stopped
    ports:
      - "3313:3313"
    volumes:
      - transmute_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--tries=1", "http://localhost:3313/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RYOT_PASSWORD: ${RYOT_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ryot:
    image: ignisda/ryot:v10
    container_name: ryot
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=ryot"
      - "docktail.service.port=8000"
      - "docktail.service.service-port=443"
    ports:
      - "8000:8000"
    environment:
      - SERVER_ADMIN_ACCESS_TOKEN=CHANGE_ME_TO_A_LONG_RANDOM_STRING
      - DATABASE_URL=postgres://ryot:${RYOT_PASSWORD}@db:5432/ryot
      - TZ=America/Bogota

volumes:
  transmute_data:
  db_data:
  redis_data:
  postgres_storage:
